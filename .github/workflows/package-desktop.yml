# 方案 A：单独仓库 + 直接 checkout 上游 —— 只有这一条 workflow 会跑
#
# 为什么这样最干净：上游仓库里那 20 个 workflow 不会被执行（它们只是被 checkout 到工作区的文件），
# 你不需要 fork，也就不需要每天同步、不会有 merge 冲突，GitHub 上不会出现别的 CI 噪音。
#
# 一次性准备（在本地）：
#   1) GitHub 网页新建**空仓库**（例如 dsh-daily-package，Public 免费用标准 runner / Private 每月 2000 分钟且 Windows ×2），
#      不要勾选 README / .gitignore。
#   2) 把本文件放到 <新仓库>/.github/workflows/package-desktop.yml，然后：
#        cd <新仓库>
#        git init -b main
#        git add -A
#        git commit -m "ci: daily unsigned win-x64 desktop package from upstream"
#        git remote add origin https://github.com/<你>/dsh-daily-package.git
#        git -c http.sslBackend=openssl push -u origin main      # 你这台机器必须带 openssl 后端，否则撞 SEC_E_NO_CREDENTIALS
#   3) Actions 页 → 启用 workflows → 选 package-desktop → Run workflow（第一次先手动跑）。
#
# 判断"要不要重新打包"：把已构建的上游 SHA 记成一个 Release（tag = build-<sha前12位>）。
# 每次触发先查上游 master 的 SHA，已经有对应 Release 就跳过——所以"每天触发、只在有提交时构建"。
#
# 产物是**未签名**的 Windows x64 安装包（正式签名需要 EV 硬件 Token，托管 runner 没有 USB Token）：
# 没有 app-update.yml（应用内不会自动更新），拷到别的机器可能需要 Unblock-File。
# macOS 需要 Apple 开发者凭据，这里不做。
name: package-desktop

on:
  workflow_dispatch:
    inputs:
      force:
        description: 忽略"已构建过"的判断，强制重新打包
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = 北京 02:00

permissions:
  contents: write # 创建 Release 需要写权限

concurrency:
  group: package-desktop
  cancel-in-progress: false

jobs:
  upstream:
    name: resolve upstream commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        name: 查上游 master 的 SHA / 版本，并看这个 SHA 是否已经打过包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha=$(gh api repos/deepseek-ai/deepseek-harness/commits/master --jq .sha)
          short=${sha:0:12}
          version=$(gh api "repos/deepseek-ai/deepseek-harness/contents/package.json?ref=$sha" --jq .content \
            | base64 -d | jq -r .version)
          echo "上游 master = $sha (dsh $version)"
          if gh release view "build-$short" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            built=true
          else
            built=false
          fi
          echo "已构建过 build-$short ? $built"
          if [ "$built" = "true" ] && [ "${FORCE:-false}" != "true" ]; then
            echo "→ 这个提交已经打过包，跳过构建"
            state=false
          else
            state=true
          fi
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "version=$version"
            echo "build=$state"
          } >> "$GITHUB_OUTPUT"

  package:
    name: package desktop (unsigned win-x64)
    needs: upstream
    if: needs.upstream.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      # 直接拉上游代码（不是你的仓库）：upstream 的 workflow 只是普通文件，不会被执行
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.upstream.outputs.sha }} # 若 checkout 报找不到该 SHA，改成 master 即可
          fetch-depth: 1

      # 实测一次完整构建 ≈5.5 GB（node_modules 2.3 GB + .desktop-build 2.8 GB），
      # 托管 runner 约 14 GB 可用；清盘失败不致命，所以 continue-on-error。
      - name: Free disk space
        continue-on-error: true
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0 # 必须对齐上游根 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 别用 3.14：node-gyp 生态还不稳

      # 必须落盘成文件：package-target.ts 只从文件读发布配置，且会过滤环境里的同名 DSH_DESKTOP_* 变量。
      # AUTO_UPDATE_ENV 用 production：test 的策略源站要求飞书登录，会让打出来的应用卡在启动加载页。
      - name: Write apps/desktop/.env.windows
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.example.dsh.daily
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          '@ | Set-Content -Encoding utf8 apps/desktop/.env.windows

      - name: Install
        run: pnpm install --frozen-lockfile

      # 链路 = build:official → release:pack dsh/vendor → desktop-host → native/system
      # → prepare:runtime → prepare:packages → prepare:dsh → electron-builder（本机实测 15 分钟）
      - name: Package (unsigned win-x64)
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64-${{ needs.upstream.outputs.version }}-${{ needs.upstream.outputs.short }}
          if-no-files-found: error
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap

      - name: Upload packaging logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-runs-${{ needs.upstream.outputs.short }}
          if-no-files-found: ignore
          path: apps/desktop/.desktop-build/packaging-runs/**

      # 只有成功走到这里才会写下 tag → 失败的构建不会被误判成"已构建"
      - name: Release (记录已构建的 SHA)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "build-${{ needs.upstream.outputs.short }}"
          $exe = (Get-ChildItem apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe |
                  Select-Object -First 1).FullName
          gh release create $tag $exe `
            --repo $env:GITHUB_REPOSITORY `
            --title "dsh ${{ needs.upstream.outputs.version }} unsigned win-x64" `
            --notes "upstream commit ${{ needs.upstream.outputs.sha }} | 未签名构建：可能有 SmartScreen 提示，未包含自动更新配置"
