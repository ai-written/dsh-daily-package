# 打包来源默认 = 上游**最新发布的 tag**（`dsh-v*`）——也就是"上游发版才打包"。
#   想改成跟 master 最新提交：手动 Run workflow 时把 source 选成 `master`；
#   想让定时任务也跟 master：仓库 Settings → Secrets and variables → Actions → Variables
#   新建 `DEFAULT_SOURCE=master`（定时任务读它，不设则用 `tag`）。
#
# 用什么记录"已经打过哪个版本"：Release tag `build-<key>`
#   - tag 模式   key = `dsh-v0.1.6-alpha.2` → Release `build-dsh-v0.1.6-alpha.2`
#   - master 模式 key = 提交 SHA 前 12 位   → Release `build-<sha12>`
# 每天触发时先算 key：已经有对应 Release 就跳过（十几秒结束，windows runner 不会启动）。
#
# 注意：上游目前的 release 全是 pre-release（alpha/rc），所以这里**不过滤预发布**，
# 否则永远没有可打包的 tag；同时不能用 `releases/latest`（它只认非 pre-release，会 404）。
#
# 产物是**未签名**的 Windows x64 安装包（正式签名要 EV 硬件 Token，托管 runner 没有 USB Token）：
# 没有 app-update.yml（应用内不会自动更新）。macOS 需要 Apple 开发者凭据，这里不做。
name: package-desktop

on:
  workflow_dispatch:
    inputs:
      force:
        description: 忽略"已打过包"的判断，强制重新打包
        type: boolean
        default: false
      source:
        description: 打包来源
        type: choice
        options: [tag, master]
        default: tag
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = 北京 02:00

permissions:
  contents: write # 创建 Release 需要写权限

concurrency:
  group: package-desktop
  cancel-in-progress: false

jobs:
  upstream:
    name: resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      key: ${{ steps.check.outputs.key }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      mode: ${{ steps.check.outputs.mode }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        name: 解析上游 tag / 提交，并判断是否已经打过包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_INPUT: ${{ inputs.source }}
          DEFAULT_SOURCE: ${{ vars.DEFAULT_SOURCE || 'tag' }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          API=repos/deepseek-ai/deepseek-harness
          mode="${SRC_INPUT:-$DEFAULT_SOURCE}"

          if [ "$mode" = "master" ]; then
            ref=master
            sha=$(gh api "$API/commits/master" --jq .sha)
            key=${sha:0:12}
          else
            mode=tag
            # 最新一个已发布、且 tag 以 dsh-v 开头的 release（上游还有 vendor 等其它 tag 家族）
            ref=$(gh api "$API/releases?per_page=50" \
              --jq '[.[] | select(.draft == false) | .tag_name | select(startswith("dsh-v"))][0]')
            if [ -z "$ref" ] || [ "$ref" = "null" ]; then
              echo "上游没有 dsh-v* 的发布 tag，放弃"; exit 1
            fi
            sha=$(gh api "$API/commits/$ref" --jq .sha)
            key=$ref
          fi

          version=$(gh api "$API/contents/package.json?ref=$sha" --jq .content \
            | base64 -d | jq -r .version)
          echo "模式=$mode  ref=$ref  sha=$sha  dsh=$version  key=$key"

          if gh release view "build-$key" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            built=true
          else
            built=false
          fi
          echo "已打过包 build-$key ? $built"

          if [ "$built" = "true" ] && [ "${FORCE:-false}" != "true" ]; then
            echo "→ 这个版本已经打过包，跳过构建"
            state=false
          else
            state=true
          fi

          {
            echo "ref=$ref"
            echo "key=$key"
            echo "version=$version"
            echo "sha=$sha"
            echo "mode=$mode"
            echo "build=$state"
          } >> "$GITHUB_OUTPUT"

  package:
    name: package desktop (unsigned win-x64)
    needs: upstream
    if: needs.upstream.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      # 直接拉上游代码（不是本仓库）：上游自带的那 20 个 workflow 只是普通文件，不会被执行
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.upstream.outputs.ref }} # tag 模式 = 上游 tag；master 模式 = master
          fetch-depth: 1

      # 实测一次完整构建 ≈5.5 GB（node_modules 2.3 GB + .desktop-build 2.8 GB），
      # 托管 runner 约 14 GB 可用；清盘失败不致命，所以 continue-on-error。
      - name: Free disk space
        continue-on-error: true
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0 # 必须对齐上游根 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 别用 3.14：node-gyp 生态还不稳

      # 必须落盘成文件：package-target.ts 只从文件读发布配置，且会过滤环境里的同名 DSH_DESKTOP_* 变量。
      # AUTO_UPDATE_ENV 用 production：test 的策略源站要求飞书登录，会让打出来的应用卡在启动加载页。
      - name: Write apps/desktop/.env.windows
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.example.dsh.daily
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          '@ | Set-Content -Encoding utf8 apps/desktop/.env.windows

      - name: Install
        run: pnpm install --frozen-lockfile

      # 链路 = build:official → release:pack dsh/vendor → desktop-host → native/system
      # → prepare:runtime → prepare:packages → prepare:dsh → electron-builder（本机实测 15 分钟）
      - name: Package (unsigned win-x64)
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64-${{ needs.upstream.outputs.key }}
          if-no-files-found: error
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap

      - name: Upload packaging logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-runs-${{ needs.upstream.outputs.key }}
          if-no-files-found: ignore
          path: apps/desktop/.desktop-build/packaging-runs/**

      # 只有成功走到这里才会写下 tag → 失败的构建不会被误判成"已构建"，下次会重试
      - name: Release (记录已构建的版本)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "build-${{ needs.upstream.outputs.key }}"
          $exe = (Get-ChildItem apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe |
                  Select-Object -First 1).FullName
          gh release create $tag $exe `
            --repo $env:GITHUB_REPOSITORY `
            --title "dsh ${{ needs.upstream.outputs.version }} unsigned win-x64" `
            --notes "上游 ${{ needs.upstream.outputs.mode }}: ${{ needs.upstream.outputs.ref }} (${{ needs.upstream.outputs.sha }}) | 未签名构建：可能有 SmartScreen 提示，未包含自动更新配置"
